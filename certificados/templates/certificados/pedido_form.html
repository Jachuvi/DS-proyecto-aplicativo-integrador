{% extends "base.html" %}
{% block title %}Registrar Pedido{% endblock %}
{% block page_title %}Registrar Pedido{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body p-4">
        <h2 class="card-title mb-1">Nuevo Pedido</h2>
        <p class="text-muted mb-4">Captura los datos del pedido solicitado por el cliente.</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="{{ form.cliente.id_for_label }}" class="form-label">Cliente</label>
                {{ form.cliente }}
            </div>
            <div class="mb-3">
                <label for="{{ form.producto.id_for_label }}" class="form-label">Producto</label>
                <select name="producto" id="id_producto" class="form-select" required>
                    <option value="">Seleccione un producto...</option>
                    {% for producto in productos %}
                    <option value="{{ producto.id }}">{{ producto.codigo }} - {{ producto.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="{{ form.cantidad.id_for_label }}" class="form-label">Cantidad</label>
                {{ form.cantidad }}
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn-brand">Guardar Pedido</button>
                <a href="{% url 'home' %}" class="btn-brand-outline">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script>
    document.querySelectorAll('form input, form select, form textarea').forEach(el => {
        if (el.tagName === 'SELECT') el.classList.add('form-select');
        else if (el.type !== 'checkbox' && el.type !== 'radio' && el.type !== 'hidden' && el.type !== 'submit')
            el.classList.add('form-control');
    });
</script>
{% endblock %}
