{% extends "base.html" %}
{% block title %}Nuevo Lote{% endblock %}
{% block page_title %}Nuevo Lote{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body p-4">
        <h2 class="card-title mb-3">Crear Nuevo Lote</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_producto" class="form-label">Producto</label>
                <select name="producto" id="id_producto" class="form-select" required>
                    <option value="">Seleccione un producto...</option>
                    {% for producto in productos %}
                    <option value="{{ producto.id }}">{{ producto.codigo }} - {{ producto.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="id_cantidad" class="form-label">Cantidad (kg)</label>
                <input type="number" name="cantidad" id="id_cantidad" class="form-control" step="0.01" required>
            </div>
            <div class="mb-3">
                <label for="id_fecha_caducidad" class="form-label">Fecha de Caducidad</label>
                <input type="date" name="fecha_caducidad" id="id_fecha_caducidad" class="form-control" required>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn-brand">Crear Lote</button>
                <a href="{% url 'lote_list' %}" class="btn-brand-outline">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
